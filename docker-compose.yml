services:
  influxdb:
    image: influxdb:2.7
    container_name: moonflux-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: moonflux
      DOCKER_INFLUXDB_INIT_PASSWORD: moonflux-password
      DOCKER_INFLUXDB_INIT_ORG: moonflux
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: moonflux-token
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 5s
      timeout: 3s
      retries: 20
